general {
    ignore_empty_input = true
    hide_cursor = true
}

animations {
    enabled = false
}

background {
    monitor =
    path = $HOME/.config/hypr/nasa.jpg
    color = rgba(25, 20, 20, 1.0)
    blur_passes = 0
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

input-field {
    monitor =
    size = 250, 50
    outline_thickness = 2
    dots_size = 0.33
    dots_spacing = 0.15
    dots_center = true
    outer_color = rgba(255, 255, 255, 0.2)
    inner_color = rgba(0, 0, 0, 0.5)
    font_color = rgba(255, 255, 255, 1.0)
    
    fade_on_empty = true
    placeholder_text = 
    rounding = 8
    fail_timeout = 500

    position = 0, 200
    halign = center
    valign = bottom
}

label {
    monitor =
    text = <b>$TIME</b>
    color = rgba(255, 255, 255, 1.0)
    font_size = 90
    font_family = sans-serif
    position = 0, -100
    halign = center
    valign = top
}

label {
    monitor =
    text = cmd[update:10000] echo "<b>$(date +'%A, %B %d')</b>"
    color = rgba(255, 255, 255, 1.0)
    font_size = 24
    font_family = sans-serif
    position = 0, -250
    halign = center
    valign = top
}

label {
    monitor =
    text = cmd[update:30000] echo "  <b>$(cat /sys/class/power_supply/BAT0/capacity)%</b>"
    color = rgba(255, 255, 255, 1.0)
    font_size = 16
    font_family = sans-serif
    position = -50, 50
    halign = right
    valign = bottom
}
